<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Telegram - TToan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700 relative">
        
        <!-- NÚT ĐĂNG XUẤT -->
        <div class="absolute top-4 right-4">
            <button onclick="handleLogout()" class="bg-red-600/20 hover:bg-red-600/40 text-red-400 px-3 py-1.5 rounded-lg text-xs font-semibold transition border border-red-500/30">🚪 Đăng xuất</button>
        </div>

        <h1 class="text-2xl font-bold text-center text-cyan-400 mb-6">HỆ THỐNG GET KEY</h1>

        <div class="mb-4 bg-slate-900 p-3 rounded-lg text-sm text-slate-400 flex justify-between items-center">
            <span>Telegram ID: <b id="teleIdDisplay" class="text-cyan-300 font-mono"></b></span>
        </div>

        <div class="mb-6 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl p-4 text-center shadow-lg">
            <p class="text-sm uppercase tracking-wider font-semibold opacity-90">Số dư hiện tại</p>
            <p class="text-4xl font-extrabold mt-1"><span id="coinBalance">0.0</span> <span class="text-lg">COIN</span></p>
        </div>

        <div class="space-y-3 mb-6">
            <button type="button" onclick="doLinkTask()" class="w-full bg-emerald-600 hover:bg-emerald-500 transition font-bold py-3 px-4 rounded-xl shadow-md flex items-center justify-center space-x-2">
                <span>🚀 Vượt Link Kiếm 0.5 Coin</span>
            </button>

            <!-- TRỪ 2 COIN KHI ĐỔI KEY -->
            <button type="button" onclick="exchangeKey()" class="w-full bg-indigo-600 hover:bg-indigo-500 transition font-bold py-3 px-4 rounded-xl shadow-md flex items-center justify-center space-x-2">
                <span>🔑 Đổi Key (Giá: 2 Coin)</span>
            </button>
        </div>

        <div class="bg-slate-900 rounded-xl p-4 border border-slate-700">
            <h2 class="text-sm font-semibold text-slate-400 mb-2">Key Của Bạn:</h2>
            <div class="flex items-center justify-between bg-slate-800 p-2 rounded-lg">
                <input type="text" id="latestKey" readonly value="Chưa có key nào" class="bg-transparent w-full text-sm font-mono text-yellow-400 focus:outline-none">
                <button type="button" onclick="copyKey()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1 text-xs rounded-md transition">Sao chép</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAKJQwQpXNMN31QoN4UNBJt6rigrkoYk6I",
            authDomain: "ttoan-like-bot.firebaseapp.com",
            databaseURL: "https://ttoan-like-bot-default-rtdb.firebaseio.com/",
            projectId: "ttoan-like-bot",
            storageBucket: "ttoan-like-bot.firebasestorage.app",
            messagingSenderId: "322115758267",
            appId: "1:322115758267:web:157c58b911500f83bc619e",
            measurementId: "G-15RMWQHBKX"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const SESSION_DURATION = 7 * 24 * 60 * 60 * 1000;
        let savedSession = JSON.parse(localStorage.getItem('ttoan_tele_session') || 'null');

        if (!savedSession || (Date.now() - savedSession.time > SESSION_DURATION)) {
            localStorage.removeItem('ttoan_tele_session');
            window.location.href = 'index.html';
        } else {
            const teleId = savedSession.teleId;
            document.getElementById('teleIdDisplay').innerText = teleId;
            
            db.ref('accounts/tele_' + teleId).on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    document.getElementById('coinBalance').innerText = (data.coins || 0.0).toFixed(1);
                    document.getElementById('latestKey').value = data.latestKey || 'Chưa có';
                }
            });
        }

        function handleLogout() {
            localStorage.removeItem('ttoan_tele_session');
            window.location.href = 'index.html';
        }

        function doLinkTask() {
            const session = JSON.parse(localStorage.getItem('ttoan_tele_session') || '{}');
            const teleId = session.teleId;
            const baseUrl = window.location.origin + window.location.pathname.replace('getkey.html', '');
            const targetUrl = `${baseUrl}complete.html?tele=${teleId}`;
            
            const apiToken = "667da5e0512ac00cba52fb6f";
            const link4mApiUrl = `https://link4m.co/st?api=${apiToken}&url=${encodeURIComponent(targetUrl)}`;

            window.location.href = link4mApiUrl;
        }

        function exchangeKey() {
            const session = JSON.parse(localStorage.getItem('ttoan_tele_session') || '{}');
            const teleId = session.teleId;
            const userRef = db.ref('accounts/tele_' + teleId);

            userRef.transaction((currentData) => {
                if (!currentData) return;
                
                // Kiểm tra đủ 2 coin không
                if (currentData.coins < 2.0) {
                    alert('Bạn cần ít nhất 2 Coin để đổi key! Hãy vượt thêm link.');
                    return; 
                }

                currentData.coins -= 2.0; // Trừ đúng 2 coin
                const newKey = 'TTOAN-' + Math.random().toString(36).substring(2, 10).toUpperCase();
                currentData.latestKey = newKey;

                db.ref('keys/' + newKey).set({
                    used: false,
                    owner: teleId,
                    createdAt: Date.now()
                });

                return currentData;
            }, (error, committed) => {
                if (committed) {
                    alert('Đổi key thành công (-2 Coin)!');
                }
            });
        }

        function copyKey() {
            const keyInput = document.getElementById('latestKey');
            keyInput.select();
            navigator.clipboard.writeText(keyInput.value);
            alert('Đã sao chép key!');
        }
    </script>
</body>
</html>
