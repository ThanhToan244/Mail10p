<script type="module">
    // Import Firebase từ CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Cấu hình Firebase của bạn (Lấy từ file serviceAccountKey.json hoặc cấu hình web của bạn)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "mail-10p.firebaseapp.com",
        projectId: "mail-10p",
        storageBucket: "mail-10p.appspot.com",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function verifyBypass() {
        // Lấy chat_id từ phần sau dấu # trên URL (Ví dụ: .../#123456789)
        const chatId = window.location.hash.substring(1);
        const statusDiv = document.getElementById("status"); // Thẻ hiển thị thông báo trên web của bạn

        if (!chatId) {
            statusDiv.innerHTML = "❌ Lỗi hệ thống! Không tìm thấy thông tin tài khoản Telegram của bạn.";
            return;
        }

        try {
            const userRef = doc(db, "users", chatId);
            const userDoc = await getDoc(userRef);
            
            let bypassCount = 1;
            if (userDoc.exists()) {
                bypassCount = (userDoc.data().bypass || 0) + 1;
            }

            // Cập nhật trạng thái đã vượt link lên Firestore
            await setDoc(userRef, { bypass: bypassCount }, { merge: true });

            statusDiv.innerHTML = "✅ Vượt link thành công! Bạn có thể quay lại Telegram để sử dụng bot.";
        } catch (error) {
            console.error("Lỗi:", error);
            statusDiv.innerHTML = "❌ Có lỗi xảy ra khi cập nhật hệ thống.";
        }
    }

    verifyBypass();
</script>
