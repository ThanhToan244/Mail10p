<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Vượt Link</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 50px 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; max-width: 400px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .code-box { background: #334155; padding: 15px; font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #38bdf8; border-radius: 8px; margin: 20px 0; user-select: all; }
        p { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎉 Vượt Link Thành Công</h2>
        <div id="content">
            <p>Đang tạo mã xác nhận...</p>
        </div>
    </div>

    <script>
        // Tự động tạo mã ngẫu nhiên ngay trên trình duyệt của người dùng sau khi vượt link
        function generateCode(length = 6) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return result;
        }

        const code = generateCode(6);
        const contentDiv = document.getElementById('content');

        contentDiv.innerHTML = `
            <p>Mã xác nhận của bạn:</p>
            <div class="code-box">${code}</div>
            <p>Hãy copy mã này và dán lại vào khung chat của Bot Telegram.</p>
        `;
    </script>
</body>
</html>
