<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Mã Nhận Quà</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 50px 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; max-width: 400px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .code-box { background: #334155; padding: 15px; font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #38bdf8; border-radius: 8px; margin: 20px 0; user-select: all; }
        p { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🎉 Vượt Link Thành Công!</h2>
        <p>Mã xác nhận độc quyền của bạn (có hiệu lực trong 10 phút):</p>
        <div class="code-box" id="secretCode">Đang tải mã...</div>
        <p>Hãy copy mã này và dán lại vào khung chat của Bot Telegram để hoàn tất mở khóa.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const codeBox = document.getElementById('secretCode');
        
        if (code) {
            codeBox.innerText = code;
        } else {
            codeBox.innerText = "LỖI MÃ!";
            codeBox.style.color = "#ef4444";
        }
    </script>
</body>
</html>
