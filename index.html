<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Mã Xác Nhận</title></head>
<body>
    <div id="codeDisplay">Đang tải...</div>
    <button onclick="copyCode()">Sao Chép</button>
    <script>
        // Lấy mã từ hash (#...) và xóa nó khỏi thanh địa chỉ
        const code = window.location.hash.substring(1).toUpperCase();
        if(code) {
            document.getElementById('codeDisplay').innerText = code;
            history.replaceState(null, null, ' ');
        } else {
            document.getElementById('codeDisplay').innerText = "LỖI!";
        }
        function copyCode() {
            navigator.clipboard.writeText(code);
            alert('Đã copy!');
        }
    </script>
</body>
</html>
