<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Telegram - TToan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <h1 class="text-2xl font-bold text-center text-cyan-400 mb-2">HỆ THỐNG TELEGRAM</h1>
        <p class="text-center text-slate-400 text-sm mb-6">Nhập ID Telegram của bạn để tiếp tục</p>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Telegram ID (Ví dụ: 123456789)</label>
                <input type="text" id="teleIdInput" placeholder="Nhập ID Telegram..." class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-cyan-400 font-mono">
            </div>
            <button type="button" onclick="handleTelegramLogin()" class="w-full bg-cyan-600 hover:bg-cyan-500 font-bold py-3 rounded-xl transition shadow-lg">Vào Hệ Thống</button>
        </div>
        
        <div class="mt-6 text-center text-xs text-slate-500">
            Dùng bot Telegram gõ lệnh <b class="text-cyan-400">/my</b> để lấy ID của bạn.
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAKJQwQpXNMN31QoN4UNBJt6rigrkoYk6I",
            authDomain: "ttoan-like-bot.firebaseapp.com",
            databaseURL: "https://ttoan-like-bot-default-rtdb.firebaseio.com/",
            projectId: "ttoan-like-bot",
            storageBucket: "ttoan-like-bot.firebasestorage.app",
            messagingSenderId: "322115758267",
            appId: "1:322115758267:web:157c58b911500f83bc619e",
            measurementId: "G-15RMWQHBKX"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Kiểm tra phiên đăng nhập sẵn
        const SESSION_DURATION = 7 * 24 * 60 * 60 * 1000;
        let savedSession = JSON.parse(localStorage.getItem('ttoan_tele_session') || 'null');
        if (savedSession && (Date.now() - savedSession.time < SESSION_DURATION)) {
            window.location.href = 'getkey.html';
        }

        async function handleTelegramLogin() {
            const teleId = document.getElementById('teleIdInput').value.trim();

            if (!teleId || isNaN(teleId)) {
                alert('Vui lòng nhập ID Telegram hợp lệ (chỉ gồm các chữ số)!');
                return;
            }

            try {
                const userRef = db.ref('accounts/tele_' + teleId);
                const snap = await userRef.get();

                if (!snap.exists()) {
                    // Nếu chưa có, tự động tạo tài khoản mới với 0 coin
                    await userRef.set({
                        teleId: teleId,
                        coins: 0.0,
                        latestKey: 'Chưa có',
                        createdAt: Date.now()
                    });
                }

                localStorage.setItem('ttoan_tele_session', JSON.stringify({ teleId: teleId, time: Date.now() }));
                window.location.href = 'getkey.html';
            } catch (error) {
                alert('Lỗi kết nối cơ sở dữ liệu!');
            }
        }
    </script>
</body>
</html>
