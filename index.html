<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Vượt Link</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #28a745; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="title">Hệ Thống Vượt Link</h2>
        <p id="status">Đang xử lý cộng quyền, vui lòng chờ trong giây lát...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtFL-IArND-ACnhOdzdyzu9010KgVEd44",
            authDomain: "mail-10p.firebaseapp.com",
            databaseURL: "https://mail-10p-default-rtdb.firebaseio.com",
            projectId: "mail-10p",
            storageBucket: "mail-10p.firebasestorage.app",
            messagingSenderId: "605076530883",
            appId: "1:605076530883:web:2dfbeecdf5d4603c09a476",
            measurementId: "G-S2WCFL4DMY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function verifyBypass() {
            const statusText = document.getElementById("status");
            const titleText = document.getElementById("title");
            
            // Đọc trực tiếp chat_id từ thanh địa chỉ URL
            const urlParams = new URLSearchParams(window.location.search);
            let chatId = urlParams.get("chat_id");
            
            // Phòng hờ nếu link bị chuyển qua dạng hash (#)
            if (!chatId && window.location.hash) {
                chatId = window.location.hash.substring(1);
            }

            if (!chatId) {
                titleText.innerText = "Lỗi hệ thống!";
                statusText.innerHTML = "❌ Không tìm thấy thông tin tài khoản.<br>Vui lòng bấm lại link từ bot Telegram.";
                statusText.className = "error";
                return;
            }

            try {
                const userRef = doc(db, "users", chatId);
                const userDoc = await getDoc(userRef);
                
                let currentBypass = 0;
                if (userDoc.exists()) {
                    currentBypass = userDoc.data().bypass || 0;
                }

                // Cộng trực tiếp 1 lượt vượt link vào Firebase cho đúng chat_id đó
                await setDoc(userRef, { bypass: currentBypass + 1 }, { merge: true });

                titleText.innerText = "Thành công!";
                statusText.innerHTML = "✅ Vượt link thành công!<br>Bây giờ bạn có thể quay lại Telegram để sử dụng bot.";
            } catch (error) {
                console.error("Lỗi:", error);
                titleText.innerText = "Lỗi kết nối!";
                statusText.innerHTML = "❌ Có lỗi xảy ra khi cập nhật hệ thống.";
                statusText.className = "error";
            }
        }

        verifyBypass();
    </script>
</body>
</html>
