<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Nhận Mã</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; text-align: center; padding: 50px 20px; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; display: inline-block; max-width: 400px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .code-box { background: #334155; padding: 15px; font-size: 24px; font-weight: bold; letter-spacing: 2px; color: #38bdf8; border-radius: 8px; margin: 20px 0; user-select: all; }
        .btn { display: inline-block; background: #2563eb; color: #fff; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        .btn:hover { background: #1d4ed8; }
        p { color: #94a3b8; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔒 Xác Thực Vượt Link</h2>
        <div id="content">
            <p>Vui lòng hoàn thành vượt link 4m để hệ thống cấp mã xác nhận.</p>
            <a href="#" id="link4mBtn" class="btn">Bấm Vào Đây Để Vượt Link</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const contentDiv = document.getElementById('content');

        // Token Link4m của bạn
        const apiToken = "667da5e0512ac00cba52fb6f";
        
        // Link đích sau khi vượt link xong sẽ trỏ lại trang này kèm theo mã code cũ
        const currentUrl = window.location.href.split('&token_status')[0];

        if (!code) {
            contentDiv.innerHTML = "<p style='color: #ef4444;'>LỖI: Thiếu mã định danh từ bot!</p>";
        } else {
            // Tạo link API chuyển hướng của Link4m
            // Cú pháp Link4m: https://link4m.co/api?api=TOKEN&url=URL_NHAN_KET_QUA
            const link4mApiUrl = `https://link4m.co/api?api=${apiToken}&url=${encodeURIComponent(currentUrl)}`;
            
            // Kiểm tra xem người dùng đã vượt link chưa (Link4m thường trả về kết quả qua trình duyệt hoặc bạn check theo ý muốn)
            // Hoặc cấu hình nút bấm chuyển thẳng tới link rút gọn của Link4m:
            const btn = document.getElementById('link4mBtn');
            btn.href = link4mApiUrl;

            // Nếu URL đã được vượt qua (Link4m thường redirect về kèm token hoặc user hoàn thành)
            // Ta hiển thị luôn mã code được đính kèm ban đầu cho user copy
            if (urlParams.has('code')) {
                // Hiển thị giao diện nhận mã khi đã qua bước trung gian
                contentDiv.innerHTML = `
                    <p>🎉 Vượt Link Thành Công!</p>
                    <p>Mã xác nhận của bạn (có hiệu lực trong 10 phút):</p>
                    <div class="code-box">${code}</div>
                    <p>Hãy copy mã này dán vào Bot Telegram.</p>
                `;
            }
        }
    </script>
</body>
</html>
