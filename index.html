<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác nhận cộng giờ - Mail10p</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 85%; max-width: 400px; }
        .loader { border: 5px solid #334155; border-top: 5px solid #22c55e; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 0.9em; }
        .success { color: #22c55e; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div id="loading">
            <div class="loader"></div>
            <h2>Đang xác nhận...</h2>
            <p>Hệ thống đang cộng giờ vào tài khoản của bạn.</p>
        </div>
        <div id="result" class="success">
            <h2 style="color: #22c55e;">Thành công! 🎉</h2>
            <p>Bạn đã được cộng thêm 1 giờ. Hãy quay lại Telegram để tiếp tục trải nghiệm!</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, runTransaction } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBtFL-IArND-ACnhOdzdyzu9010KgVEd44",
            authDomain: "mail-10p.firebaseapp.com",
            databaseURL: "https://mail-10p-default-rtdb.firebaseio.com",
            projectId: "mail-10p",
            storageBucket: "mail-10p.firebasestorage.app",
            messagingSenderId: "605076530883",
            appId: "1:605076530883:web:2dfbeecdf5d4603c09a476",
            measurementId: "G-S2WCFL4DMY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const userId = new URLSearchParams(window.location.search).get('id');

        if (userId) {
            runTransaction(ref(db, 'users/' + userId + '/gio'), (cur) => (cur || 0) + 1)
            .then(() => {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('result').style.display = 'block';
            });
        }
    </script>
</body>
</html>
