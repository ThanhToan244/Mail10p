<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Vượt Link - Mail 10P</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); display: inline-block; }
        h2 { color: #28a745; }
        p { color: #555; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="status">Đang xử lý hệ thống... ⏳</h2>
        <p id="desc">Vui lòng chờ trong giây lát, hệ thống đang cấp quyền cho bạn.</p>
    </div>

    <script>
        // CẤU HÌNH FIREBASE WEB (Lấy từ Firebase Console của bạn)
        const firebaseConfig = {
            apiKey: "AIzaSy...", // Điền API Key của bạn vào đây
            authDomain: "mail-10p.firebaseapp.com",
            projectId: "mail-10p",
            storageBucket: "mail-10p.appspot.com",
            messagingSenderId: "...",
            appId: "..."
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Lấy chat_id từ tham số trên URL (Ví dụ: .../#123456789 hoặc .../?id=123456789)
        function getChatId() {
            const hash = window.location.hash.replace('#', '');
            if (hash) return hash;
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        async function rewardUser() {
            const chatId = getChatId();
            const statusEl = document.getElementById("status");
            const descEl = document.getElementById("desc");

            if (!chatId) {
                statusEl.innerText = "❌ Lỗi hệ thống!";
                descEl.innerText = "Không tìm thấy thông tin tài khoản Telegram của bạn.";
                return;
            }

            try {
                const userRef = db.collection("users").doc(chatId);
                const doc = await userRef.get();
                const today = new Date().toISOString().split('T')[0];

                let bypass = 1;
                let extra_hours = 3;
                let active_emails = [];

                if (doc.exists) {
                    let data = doc.data();
                    // Nếu sang ngày mới thì reset lượt vượt
                    if (data.date !== today) {
                        bypass = 1;
                    } else {
                        bypass = (data.bypass || 0) + 1;
                    }
                    extra_hours = (data.extra_hours || 0) + 3;
                    active_emails = data.active_emails || [];
                }

                if (bypass > 2) {
                    statusEl.innerText = "⚠️ Đã đạt giới hạn!";
                    descEl.innerText = "Bạn đã hoàn thành tối đa 2 lần vượt link trong ngày hôm nay.";
                    return;
                }

                // Cập nhật lại dữ liệu lên Firebase Firestore
                await userRef.set({
                    bypass: bypass,
                    extra_hours: extra_hours,
                    date: today,
                    active_emails: active_emails
                }, { merge: true });

                statusEl.innerText = "🎉 Vượt Link Thành Công!";
                descEl.innerText = "Hệ thống đã cộng giờ và mở quyền cho bạn. Bạn có thể quay lại Bot Telegram để sử dụng!";
            } catch (error) {
                console.error("Lỗi Firestore:", error);
                statusEl.innerText = "❌ Lỗi kết nối!";
                descEl.innerText = "Không thể lưu dữ liệu lên hệ thống. Vui lòng thử lại sau.";
            }
        }

        window.onload = rewardUser;
    </script>
</body>
</html>
